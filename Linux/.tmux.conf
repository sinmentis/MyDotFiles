# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Preserve OSC 8 hyperlinks from terminal applications.
set -as terminal-features ',xterm*:hyperlinks'

# don't rename windows automatically
set-option -g allow-rename off



# vi mode-keys
set-window-option -g mode-keys vi
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'V' send -X rectangle-toggle
unbind-key [
bind-key Escape copy-mode
bind-key -r C-n next-window
bind-key -r C-p previous-window
unbind-key p
unbind-key n
bind-key p paste-buffer
# Copy to the OUTER terminal's clipboard via OSC52 (works over SSH on a headless
# VM). The old `xclip` target needs an X server, which this VM has none, so it
# always failed. Relies on `set-clipboard external` + a terminal that honors
# OSC52 (e.g. Windows Terminal with clipboard write enabled). Tip: if mouse
# selection still won't copy, hold Shift while dragging to use the terminal's
# native selection, then Ctrl+Shift+C.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

######################
### DESIGN CHANGES ###
######################
# Set status bar
set -g status-style none,fg=colour244,bg=colour232
set -g status-left ""
set -g status-right-style none,fg=colour250,bg=colour232
set -g status-right " %m-%d %H:%M "


# default window title colors
set-window-option -g window-status-style none,fg=colour250,bg=colour236
set-window-option -g window-status-separator ' | '

# active window title colors
set-window-option -g window-status-current-style none,fg=colour231,bg=colour33,bold

# Highlight background windows when Copilot emits a terminal bell.
set-window-option -g monitor-bell on
set-option -g bell-action other
set-window-option -g window-status-bell-style none,fg=colour232,bg=colour220,bold

# Expiring heartbeats hide stale spinners after an unclean exit.
set -g @copilot_status_clock '%s'
set -g @copilot_status_format '#{?#{||:#{==:#{@copilot_state},running},#{==:#{@copilot_state},waiting}},#{?#{>:#{@copilot_status_until},#{T:@copilot_status_clock}},#{s/^ //:@copilot_status} ,},#{?window_bell_flag,#{?@copilot_status,#{s/^ //:@copilot_status} ,},}}'
set-window-option -g window-status-format ' #I:#{P:#{E:@copilot_status_format}}#W#{window_flags} '
set-window-option -g window-status-current-format ' #I:#{P:#{E:@copilot_status_format}}#W#{window_flags} '

# pane border
set-option -g pane-border-style fg=colour14 #fg=base02
set-option -g pane-active-border-style fg=colour2 #fg=base01

# message text
set-option -g message-style bg=colour235,fg=colour166 # bg=base02, fg=orange

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
# clock
set-window-option -g clock-mode-colour green #green

# Scrollback buffer size
set-option -g history-limit 10000

set -g status-interval 1
set -g status-justify left # center align window list
set -g status-left-length 20
set -g status-right-length 140
