# Reload this config.
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Truecolor: tell tmux the outer terminal supports 24-bit RGB (otherwise it
# downsamples to 256 colors), and advertise it to apps running inside panes.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set-environment -g COLORTERM truecolor

# Full-screen TUIs: deliver Esc immediately, forward focus changes, and pass
# modified keys such as Shift+Enter through to the application.
set -sg escape-time 10
set -g focus-events on
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'

# Number windows and panes from 1 and close gaps when a window exits.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# New windows and splits open in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Preserve OSC 8 hyperlinks from terminal applications.
set -as terminal-features ',xterm*:hyperlinks'

# don't rename windows automatically
set-option -g allow-rename off



# vi mode-keys
set-window-option -g mode-keys vi
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'V' send -X rectangle-toggle
unbind-key [
bind-key Escape copy-mode
bind-key -r C-n next-window
bind-key -r C-p previous-window
unbind-key p
unbind-key n
bind-key p paste-buffer
# Copy to the OUTER terminal's clipboard via OSC52 (works over SSH on a headless
# VM). The old `xclip` target needs an X server, which this VM has none, so it
# always failed. Relies on `set-clipboard external` + a terminal that honors
# OSC52 (e.g. Windows Terminal with clipboard write enabled). Tip: if mouse
# selection still won't copy, hold Shift while dragging to use the terminal's
# native selection, then Ctrl+Shift+C.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

##############
### Design ###
##############
# A transparent bar lets Windows Terminal's acrylic background show through.
set -g status-style none,fg=#808080,bg=default
set -g status-left ""
set -g status-right-style none,fg=#bcbcbc,bg=default
set -g status-right " %m-%d %H:%M "

# default window title colors
set-window-option -g window-status-style none,fg=#bcbcbc,bg=#303030
set-window-option -g window-status-separator ' | '

# active window title colors
set-window-option -g window-status-current-style none,fg=#ffffff,bg=#0087ff,bold

# Highlight background windows when Copilot emits a terminal bell.
set-window-option -g monitor-bell on
set-option -g bell-action other
set-window-option -g window-status-bell-style none,fg=#080808,bg=#ffd700,bold

# Expiring heartbeats hide stale spinners after an unclean exit.
set -g @copilot_status_clock '%s'
set -g @copilot_status_format '#{?#{||:#{==:#{@copilot_state},running},#{==:#{@copilot_state},waiting}},#{?#{>:#{@copilot_status_until},#{T:@copilot_status_clock}},#{s/^ //:@copilot_status} ,},#{?window_bell_flag,#{?@copilot_status,#{s/^ //:@copilot_status} ,},}}'
set-window-option -g window-status-format ' #I:#{P:#{E:@copilot_status_format}}#W#{window_flags} '
set-window-option -g window-status-current-format ' #I:#{P:#{E:@copilot_status_format}}#W#{window_flags} '

# Muted borders keep TUI frames readable; the active pane uses the tab accent.
set-option -g pane-border-style fg=#3a3a3a
set-option -g pane-active-border-style fg=#0087ff
set-option -g pane-border-lines heavy

set-option -g message-style bg=#262626,fg=#d75f00
set-option -g display-panes-active-colour '#0087ff'
set-option -g display-panes-colour '#d75f00'
set-window-option -g clock-mode-colour '#5faf00'

# Scrollback buffer size
set-option -g history-limit 50000

set -g status-interval 1
set -g status-justify left # center align window list
set -g status-left-length 20
set -g status-right-length 140
